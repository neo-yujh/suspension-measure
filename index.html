<html lang="ko">
<head>

<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>서스펜션 측정 실행</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@500&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
/* 휴대폰 한 손 조작: 위 진행 막대, 가운데 할 일 카드 하나, 아래 고정 버튼. 기록·사진은 이 휴대폰 브라우저 안(IndexedDB)에만 저장하고, 끝나면 ZIP 하나로 묶어 구글 드라이브에 올린다. */
:root{
  --bg:#f4f5f2; --card:#ffffff; --ink:#1c2830; --muted:#5d6b72; --line:#c3ccd0;
  --accent:#0e6b6f; --accent-ink:#ffffff; --hand:#9a520c; --hand-bg:#fbefe0;
  --ok:#2f7a3a; --warn:#a2560c; --sel-bg:#e1f2f1; --icon:#1c2830;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#131a1e; --card:#1c252a; --ink:#e4e9eb; --muted:#9caab0; --line:#3d4b51;
  --accent:#5cc4bf; --accent-ink:#0d1a1c; --hand:#f0b073; --hand-bg:#3a2a19;
  --ok:#7ccf88; --warn:#f0b073; --sel-bg:#173634; --icon:#e4e9eb; color-scheme:dark}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
.app{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-top:calc(12px + env(safe-area-inset-top,0px));padding-bottom:110px;max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
h1{font-size:19px;margin:0} h2{font-size:17px;margin:0}
.muted{color:var(--muted)} .small{font-size:13px} .mono{font-family:var(--f-mono)}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:10px}
.btn{font:inherit;font-size:15px;border-radius:8px;padding:10px 14px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;min-height:44px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.btn:disabled{opacity:.45}
.btn:focus-visible,input:focus-visible,.opt:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input[type=text],input[type=number],input[type=date],select{font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 10px;width:100%;min-height:44px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
.fields{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.unit{display:flex;align-items:center;gap:6px} .unit span{font-family:var(--f-mono);font-size:13px;color:var(--muted)}
.cell{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.progress{height:6px;background:var(--line);border-radius:3px;overflow:hidden} .progress>i{display:block;height:100%;background:var(--accent)}
.stagebar{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--muted)}
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.opt{font:inherit;font-size:14px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px;cursor:pointer;display:flex;flex-direction:column;gap:6px;align-items:center;min-height:44px}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--sel-bg);font-weight:700}
.opt:disabled{opacity:.5;cursor:default}
.opt svg{width:72px;height:56px;stroke:var(--icon);fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.photos{display:flex;gap:8px;flex-wrap:wrap}
.ph{width:88px;height:88px;border-radius:6px;border:1px solid var(--line);object-fit:cover}
.phbtn{width:88px;height:88px;border-radius:6px;border:1px dashed var(--line);display:flex;align-items:center;justify-content:center;text-align:center;font-size:12px;color:var(--muted);cursor:pointer;background:var(--bg);font-family:inherit}
.footer{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.footer .in{max-width:640px;margin:0 auto;display:flex;gap:8px} .footer .btn{flex:1}
.status{font-size:12px;color:var(--muted);min-height:1.5em;margin:0} .status.err{color:var(--warn)}
.runrow{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap;padding-bottom:8px;border-bottom:1px solid var(--line)} .grow{flex:1 1 auto;min-width:0}
.runrow>.grow{flex-basis:100%} .runrow>.btn{flex:1 1 0;white-space:nowrap;padding-inline:8px}
.check{display:flex;gap:8px;align-items:center;font-size:14px} .check input{width:22px;height:22px}
.calc{font-size:13px;color:var(--muted)}
.carstate{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.carstate .cs{font-size:13px;padding:3px 10px;border-radius:14px;border:1px solid var(--line);color:var(--muted);background:var(--card)}
.carstate .cs.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.carstate .arrow{color:var(--muted);font-size:12px}
.hidden{display:none!important}
/* 화면 안 카메라 */
.cam{position:fixed;inset:0;background:#000;z-index:30;display:flex;flex-direction:column}
.cam video{flex:1;width:100%;min-height:0;object-fit:contain;background:#000}
.cam .bar{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:12px max(16px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));background:#000}
.cam .shutter{width:72px;height:72px;border-radius:50%;border:4px solid #fff;background:#fff;box-shadow:inset 0 0 0 4px #000;cursor:pointer}
.cam .side{min-width:88px;color:#fff;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.3);border-radius:8px;padding:8px 10px;font:inherit;font-size:13px;cursor:pointer}
.cam .hint{position:absolute;top:calc(10px + env(safe-area-inset-top,0px));left:0;right:0;text-align:center;color:#fff;font-size:14px;text-shadow:0 1px 3px #000;padding:0 16px}
</style>
</head>

<div class="app">
  <header><h1>서스펜션 측정 실행 <span id="revtag" class="small muted" style="font-weight:normal;cursor:pointer;text-decoration:underline"></span></h1><div id="revlog" class="hidden small" style="max-height:40vh;overflow:auto;border:1px solid var(--line);border-radius:8px;padding:6px 8px;margin:6px 0"></div><p class="small muted" style="margin:2px 0 0">기록과 사진은 이 휴대폰에만 저장됩니다. 끝나면 ZIP으로 묶어 구글 드라이브에 올리세요.</p></header>
  <div id="view"></div>
  <p class="status" id="status" role="status"></p>
</div>
<div class="footer hidden" id="footer"><div class="in">
  <button type="button" class="btn" id="prev">이전</button>
  <button type="button" class="btn primary" id="next">확인 · 다음</button>
  <button type="button" class="btn" id="devskip" style="flex:none;border-style:dashed;font-size:12px;opacity:.7">개발용 건너뛰기</button>
</div></div>
<input type="file" id="filepick" accept="image/*" capture="environment" class="hidden">

/* ===== 휴대폰 저장소 (IndexedDB) ===== */
let idb=null;
function openDB(){return new Promise((res,rej)=>{const r=indexedDB.open("measure-runner",1);r.onupgradeneeded=()=>{const d=r.result;d.createObjectStore("runs",{keyPath:"id"});const p=d.createObjectStore("photos",{keyPath:"id"});p.createIndex("run","runId")};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
function tx(store,mode,fn){return new Promise((res,rej)=>{const t=idb.transaction(store,mode);const s=t.objectStore(store);const out=fn(s);t.oncomplete=()=>res(out&&out.result!==undefined?out.result:out);t.onerror=()=>rej(t.error)})}
const getAll=(store)=>tx(store,"readonly",s=>s.getAll());
const put=(store,v)=>tx(store,"readwrite",s=>s.put(v));
const del=(store,k)=>tx(store,"readwrite",s=>s.delete(k));
function photosOf(runId){return new Promise((res,rej)=>{const t=idb.transaction("photos");const q=t.objectStore("photos").index("run").getAll(runId);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})}

/* ===== 상태 ===== */
let run=null, idx=0, collect=null, confirmSkip=false;
const $=s=>document.querySelector(s);
const el=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};
const status=(m,err)=>{const s=$("#status");s.textContent=m||"";s.classList.toggle("err",!!err)};
const today=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
// 작업한 시간(activeMs): 저장 사이 간격이 10분을 넘으면 쉬다 온 것으로 보고 10분까지만 더한다 (밥·급한 일로 자리 비운 시간 제외)
async function save(){const nowMs=Date.now();if(run.lastActive){run.activeMs=(run.activeMs||0)+Math.min(nowMs-run.lastActive,10*60*1000)}run.lastActive=nowMs;run.updatedAt=new Date().toISOString();run.pos=idx;await put("runs",JSON.parse(JSON.stringify(run)));status("저장됨 · "+new Date().toLocaleTimeString())}

/* ===== 사진: 화면 안 카메라, 안 되면 휴대폰 카메라 앱 ===== */
let camStream=null;
async function takePhoto(task){
  if(!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia)){return pickFile(task)}
  try{camStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"},width:{ideal:1920},height:{ideal:1080}},audio:false})}
  catch(e){status("카메라를 쓸 수 없어 휴대폰 카메라 앱으로 엽니다 ("+e.name+").",true);return pickFile(task)}
  const box=el("div","cam");const v=el("video");v.playsInline=true;v.muted=true;v.autoplay=true;v.srcObject=camStream;box.appendChild(v);
  box.appendChild(el("div","hint",task.title+" · "+((run.photos[task.id]||[]).length+1)+"번째"));
  const bar=el("div","bar");const close=el("button","side","닫기");close.type="button";
  const shut=el("button","shutter");shut.type="button";shut.setAttribute("aria-label","찍기");
  const torch=el("button","side","플래시 끔");torch.type="button";
  bar.appendChild(close);bar.appendChild(shut);bar.appendChild(torch);box.appendChild(bar);document.body.appendChild(box);
  const track=camStream.getVideoTracks()[0];let on=false;
  const caps=track.getCapabilities?track.getCapabilities():{};
  if(!caps.torch){torch.disabled=true;torch.textContent="플래시 없음"}
  torch.onclick=async()=>{try{on=!on;await track.applyConstraints({advanced:[{torch:on}]});torch.textContent=on?"플래시 켬":"플래시 끔"}catch(e){torch.disabled=true}};
  const stop=()=>{camStream.getTracks().forEach(t=>t.stop());camStream=null;box.remove()};
  close.onclick=stop;
  shut.onclick=async()=>{
    const c=document.createElement("canvas");c.width=v.videoWidth;c.height=v.videoHeight;c.getContext("2d").drawImage(v,0,0);
    const blob=await new Promise(r=>c.toBlob(r,"image/jpeg",0.88));
    shut.disabled=true;await storePhoto(task,blob);shut.disabled=false;
    box.querySelector(".hint").textContent=task.title+" · "+((run.photos[task.id]||[]).length+1)+"번째 (찍은 것 "+(run.photos[task.id]||[]).length+"장)";
  };
}
