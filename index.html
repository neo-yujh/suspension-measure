<title>서스펜션 측정 실행</title>

<style>
/* 휴대폰 한 손 조작: 위 진행 막대, 가운데 할 일 카드 하나, 아래 고정 버튼. 기록·사진은 이 휴대폰 브라우저 안(IndexedDB)에만 저장하고, 끝나면 ZIP 하나로 묶어 구글 드라이브에 올린다. */
:root{
  --bg:#f4f5f2; --card:#ffffff; --ink:#111a20; --muted:#45525a; --line:#a9b4b9;
  --accent:#0e6b6f; --accent-ink:#ffffff; --hand:#9a520c; --hand-bg:#fbefe0;
  --ok:#2f7a3a; --warn:#a2560c; --sel-bg:#e1f2f1; --icon:#1c2830;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#0f1518; --card:#1a2328; --ink:#f1f4f5; --muted:#b6c2c7; --line:#4d5c63;
  --accent:#5cc4bf; --accent-ink:#0d1a1c; --hand:#f0b073; --hand-bg:#3a2a19;
  --ok:#7ccf88; --warn:#f0b073; --sel-bg:#173634; --icon:#e4e9eb; color-scheme:dark}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
.app{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-top:calc(12px + env(safe-area-inset-top,0px));padding-bottom:calc(130px + env(safe-area-inset-bottom,0px));max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
h1{font-size:19px;margin:0} h2{font-size:17px;margin:0}
.muted{color:var(--muted);font-size:max(14px,1em)} .small{font-size:14px} /* rev 89: 보조 글자 14px 이상 */ .mono{font-family:var(--f-mono)}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:10px}
.btn{font:inherit;font-size:15px;border-radius:8px;padding:10px 14px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;min-height:48px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.btn:disabled{opacity:.45}
.btn:focus-visible,input:focus-visible,.opt:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input[type=text],input[type=number],input[type=date],select,textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 10px;width:100%;min-height:44px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
.fields{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
/* rev 89: 측정값 칸 크게 — 야외·차량 하부에서 한눈에 */
input[type=number]{font-size:22px;font-weight:700;min-height:54px}
.unit{display:flex;align-items:center;gap:6px} .unit span{font-family:var(--f-mono);font-size:16px;font-weight:700;color:var(--ink)}
.cell{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.progress{height:6px;background:var(--line);border-radius:3px;overflow:hidden} .progress>i{display:block;height:100%;background:var(--accent)}
.stagebar{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--muted)}
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.opt{font:inherit;font-size:14px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px;cursor:pointer;display:flex;flex-direction:column;gap:6px;align-items:center;min-height:48px}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--sel-bg);font-weight:700}
.opt:disabled{opacity:.5;cursor:default}
.opt svg{width:72px;height:56px;stroke:var(--icon);fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.photos{display:flex;gap:8px;flex-wrap:wrap}
.ph{width:88px;height:88px;border-radius:6px;border:1px solid var(--line);object-fit:cover}
.phbtn{width:88px;height:88px;border-radius:6px;border:1px dashed var(--line);display:flex;align-items:center;justify-content:center;text-align:center;font-size:12px;color:var(--muted);cursor:pointer;background:var(--bg);font-family:inherit}
.footer{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:10px max(16px,env(safe-area-inset-right,0px)) max(20px,calc(14px + env(safe-area-inset-bottom,0px))) max(16px,env(safe-area-inset-left,0px))}
.footer .in{max-width:640px;margin:0 auto;display:flex;gap:8px} .footer .btn{flex:1;min-height:52px} .footer #next{flex:2.5} /* rev 89: 이전 : 다음 = 1 : 2.5 */
.status{font-size:12px;color:var(--muted);min-height:1.5em;margin:0} .status.err{color:var(--warn)}
.runrow{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap;padding-bottom:8px;border-bottom:1px solid var(--line)} .grow{flex:1 1 auto;min-width:0}
.runrow>.grow{flex-basis:100%} .runrow>.btn{flex:1 1 40%;white-space:nowrap;padding-inline:8px} /* rev 89: 두 개씩 두 줄 — 위 보기·이어서, 아래 ZIP·지우기 */
.runrow>.btn.sub{min-height:40px;font-size:14px;background:transparent}
.check{display:flex;gap:8px;align-items:center;font-size:14px} .check input{width:22px;height:22px}
.calc{font-size:13px;color:var(--muted)}
.carstate{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.carstate .cs{font-size:13px;padding:3px 10px;border-radius:14px;border:1px solid var(--line);color:var(--muted);background:var(--card)}
.carstate .cs.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.carstate .arrow{color:var(--muted);font-size:12px}
.hidden{display:none!important}
body:not(.dev) [data-dev]{display:none!important} /* rev 85: 개발용 버튼은 「개발용」 탭에서 켤 때만 (2026-11-19 유지호) */
/* 화면 안 카메라 */
/* rev 86: 높이를 보이는 화면(dvh)에 맞추고 아래 여백을 넉넉히 — 하단 내비게이션 바에 셔터가 겹치지 않게 */
.cam{position:fixed;left:0;right:0;top:0;height:100vh;height:100dvh;padding-top:env(safe-area-inset-top,0px);background:#000;z-index:30;display:flex;flex-direction:column;touch-action:none}
.cam .vw{flex:1;min-height:0;position:relative;overflow:hidden;background:#000}
.cam video{width:100%;height:100%;object-fit:contain;background:#000;transform-origin:center}
.cam .ring{position:absolute;width:64px;height:64px;margin:-32px 0 0 -32px;border:2px solid #ffd54a;border-radius:50%;pointer-events:none}
.cam .info{position:absolute;right:12px;top:calc(70px + env(safe-area-inset-top,0px));font-size:12px;min-height:30px;opacity:.8}
.cam .bar{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:10px max(16px,env(safe-area-inset-right,0px)) max(20px,calc(28px + env(safe-area-inset-bottom,0px))) max(16px,env(safe-area-inset-left,0px));background:#000}
.cam .zoom{display:flex;flex-direction:column;gap:8px;padding:8px 16px 0;background:#000;color:#fff}
.cam .chips{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.cam .chip{font:inherit;font-size:13px;min-width:44px;min-height:36px;border-radius:18px;border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.1);color:#fff;padding:4px 10px;cursor:pointer}
.cam .chip[aria-pressed="true"]{background:#fff;color:#000;font-weight:700}
.cam input[type=range]{width:100%;accent-color:#fff}
.cam .zl{position:absolute;left:0;right:0;text-align:center;color:#fff;font-size:15px;font-weight:700;text-shadow:0 1px 3px #000;top:calc(40px + env(safe-area-inset-top,0px))}
/* rev 86: 측정 보기 화면 */
.vrow{display:flex;gap:8px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line)} .vrow .grow{min-width:0;overflow-wrap:anywhere}
.vrow .btn{min-height:48px;padding:4px 12px;font-size:14px;flex:none}
.vval{font-family:var(--f-mono);font-size:14px} .vempty{color:var(--warn);font-size:13px}
.vph{width:64px;height:64px;border-radius:6px;border:1px solid var(--line);object-fit:cover;cursor:pointer}
.big{position:fixed;left:0;right:0;top:0;height:100vh;height:100dvh;padding-top:env(safe-area-inset-top,0px);background:#000;z-index:40;display:flex;flex-direction:column;align-items:stretch;justify-content:center}
.big .pic{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
.big img{max-width:100%;max-height:100%;object-fit:contain}
.big .cap{padding:10px 16px;color:#fff;font-size:13px;background:rgba(0,0,0,.6);overflow-wrap:anywhere}
.big .acts{display:flex;flex-direction:column;gap:10px;padding:10px 16px max(20px,calc(28px + env(safe-area-inset-bottom,0px)));background:#111;color:#fff}
.big .acts .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center} .big .acts .btn{background:#222;color:#fff;border-color:#555;min-height:48px}
.big .acts .del{margin-left:auto;color:#ff9b7a;border-color:#ff9b7a}
.toast{position:fixed;left:16px;right:16px;bottom:calc(100px + env(safe-area-inset-bottom,0px));z-index:50;max-width:608px;margin:0 auto;background:#222;color:#fff;border-radius:10px;padding:8px 8px 8px 14px;display:flex;align-items:center;gap:10px;justify-content:space-between;box-shadow:0 4px 16px rgba(0,0,0,.4)}
.toast .btn{background:#fff;color:#000;font-weight:700;min-height:48px}
.cam .shutter{width:72px;height:72px;border-radius:50%;border:4px solid #fff;background:#fff;box-shadow:inset 0 0 0 4px #000;cursor:pointer}
.cam .side{min-width:88px;color:#fff;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.3);border-radius:8px;padding:8px 10px;font:inherit;font-size:13px;cursor:pointer}
.cam .hint{position:absolute;top:calc(10px + env(safe-area-inset-top,0px));left:0;right:0;text-align:center;color:#fff;font-size:14px;text-shadow:0 1px 3px #000;padding:0 16px}
</style>
</head>

<div class="app">
  <header><h1>서스펜션 측정 실행 <span id="revtag" class="small muted" style="font-weight:normal;cursor:pointer;text-decoration:underline"></span></h1><div id="revlog" class="hidden small" style="max-height:40vh;overflow:auto;border:1px solid var(--line);border-radius:8px;padding:6px 8px;margin:6px 0"></div><p class="small muted" style="margin:2px 0 0">기록과 사진은 이 휴대폰에만 저장됩니다. 끝나면 ZIP으로 묶어 구글 드라이브에 올리세요.</p></header>

</div>

  <input id="devjump" data-dev="1" inputmode="numeric" placeholder="번호·S아이디" style="flex:none;width:92px;font-size:12px;border:1px dashed var(--line);border-radius:6px;padding:4px;opacity:.7">
  <button type="button" class="btn" id="devjumpgo" data-dev="1" style="flex:none;border-style:dashed;font-size:12px;opacity:.7">이동</button>
</div></div>
<input type="file" id="rawpick" class="hidden">
<input type="file" id="filepick" accept="image/*" capture="environment" class="hidden">

};
/* ===== 측정 순서 (마인드맵 0~2단계). cell = 측정시트 v.261008 첫 탭 칸 위치 (제목 줄 바로 아래 줄을 값 칸으로 봄 — 확인 필요) ===== */

 {id:"S001",st:1,kind:"form",title:"기본정보",tip:"측정시트 2행 제목 아래 3행에 들어갑니다.",fields:[["date","측정일","A3","date"],["worker","작업자","B3","pick:유지호,지민우,남정우"],["maker","차량 메이커","C3"],["model","모델명 (예: 쏘나타)","D3"],["code","코드명 (예: DN8)","E3"],["trim","세부모델 (예: 2.5T 2WD EDC)","F3"],["year","연식","H3"],["owner","고객/차주명","I3"]]},

 {"id":"S157","st":5,"car":"off","kind":"measure","topIn":["F",["plate","rod"]],"datum":["F","mount"],"cell":null,"shots":1,"laterSkip":"3D 스캔에서 측정","laterNote":"뎁스 바로 재기 어려우면 아래 버튼 — 분해 후 3D 스캔에 마운트 양면을 꼭 담고, 출고 뒤 「자리 업무」에서 넣습니다.","title":"프론트 마운트 오프셋 h (안착면 ↔ 로드 체결 자리면)","tip":"차에서 잰 장착 길이(안착면 기준)를 댐퍼 길이(로드 체결 자리면 기준)로 바꾸는 값입니다. 마운트가 위아래로 빠진 만큼 실제 스트로크가 달라집니다. 분해한 상단 마운트를 안착면(차대에 닿던 면)이 바닥에 닿게 엎고, 버니어 깊이 바로 바닥 ↔ 로드 체결 자리면(로드 너트 아래 와셔가 로드 어깨에 물리는 면)을 잽니다. 자리면이 안착면보다 아래(스프링 쪽)면 + 값, 위면 앞에 −를 붙입니다."},

 {"id":"S171","st":5,"car":"off","kind":"measure","datum":["F","damper"],"cell":null,"shots":1,"title":"프론트 최대 신장 길이 (R ↔ K, 다 늘어남)","tip":"로드가 다 늘어난 상태(가스압으로 저절로 나오거나 손으로 끝까지 당김)에서 R ↔ K. 남은 신장 스트로크와 마운트 오프셋 검산(탈거 전장 − 이 값 = h)에 씁니다. 비우면 탈거 전장 − h로 계산합니다."},

 {"id":"S158","st":5,"car":"off","kind":"measure","topIn":["R",["plate","rod"]],"datum":["R","mount"],"cell":null,"shots":1,"laterSkip":"3D 스캔에서 측정","laterNote":"뎁스 바로 재기 어려우면 아래 버튼 — 분해 후 3D 스캔에 마운트 양면을 꼭 담고, 출고 뒤 「자리 업무」에서 넣습니다.","title":"리어 마운트 오프셋 h (안착면 ↔ 로드 체결 자리면)","tip":"차에서 잰 장착 길이(안착면 기준)를 댐퍼 길이(로드 체결 자리면 기준)로 바꾸는 값입니다. 마운트가 위아래로 빠진 만큼 실제 스트로크가 달라집니다. 분해한 상단 마운트를 안착면(차대에 닿던 면)이 바닥에 닿게 엎고, 버니어 깊이 바로 바닥 ↔ 로드 체결 자리면(로드 너트 아래 와셔가 로드 어깨에 물리는 면)을 잽니다. 자리면이 안착면보다 아래(스프링 쪽)면 + 값, 위면 앞에 −를 붙입니다."},

 {id:"S227",topIn:["R",["eye"]],st:5,car:"off",kind:"measure",title:"리어 상단 아이 부시 속관 길이 (양 끝면 사이)",tip:"아이 가운데 고무 부시를 지나는 쇠 속관(볼트가 지나가는 관)의 양 끝면 사이 거리를 버니어 캘리퍼스로 잽니다. 우리 제품이 차 브래킷 사이에 물리는 폭이라 정확해야 합니다 (2026-11-17 유지호). 속관이 고무보다 튀어나온 끝면끼리 잽니다.",cell:null,shots:1,photoReq:true},
 {"id":"S170","st":5,"car":"off","kind":"measure","must":true,"datum":["R","damper"],"cell":null,"shots":1,"title":"리어 최대 압축 길이 (R ↔ K, 끝까지 누름)","tip":"정하중에서 남은 압축 스트로크 = 정하중 댐퍼 길이 − 이 값. 3D 스캔으로는 잴 수 없는 값입니다(눌러야 함). 스프링·범프스토퍼·더스트 커버를 뺀 댐퍼를 세워 로드를 끝까지 눌러 넣고, 로드 체결 자리면(R) ↔ 하단 체결 기준(K)을 잽니다. 범프스토퍼는 무시한 값입니다."},
 {"id":"S172","st":5,"car":"off","kind":"measure","datum":["R","damper"],"cell":null,"shots":1,"title":"리어 최대 신장 길이 (R ↔ K, 다 늘어남)","tip":"로드가 다 늘어난 상태(가스압으로 저절로 나오거나 손으로 끝까지 당김)에서 R ↔ K. 남은 신장 스트로크와 마운트 오프셋 검산(탈거 전장 − 이 값 = h)에 씁니다. 비우면 탈거 전장 − h로 계산합니다."},

/* ===== 휴대폰 저장소 (IndexedDB) ===== */
let idb=null;
function openDB(){return new Promise((res,rej)=>{const r=indexedDB.open("measure-runner",1);r.onupgradeneeded=()=>{const d=r.result;d.createObjectStore("runs",{keyPath:"id"});const p=d.createObjectStore("photos",{keyPath:"id"});p.createIndex("run","runId")};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
function tx(store,mode,fn){return new Promise((res,rej)=>{const t=idb.transaction(store,mode);const s=t.objectStore(store);const out=fn(s);t.oncomplete=()=>res(out&&out.result!==undefined?out.result:out);t.onerror=()=>rej(t.error)})}
const getAll=(store)=>tx(store,"readonly",s=>s.getAll());
const put=(store,v)=>tx(store,"readwrite",s=>s.put(v));
const del=(store,k)=>tx(store,"readwrite",s=>s.delete(k));
function photosOf(runId){return new Promise((res,rej)=>{const t=idb.transaction("photos");const q=t.objectStore("photos").index("run").getAll(runId);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})}

/* ===== rev 86: 측정 ZIP 불러오기 (2026-11-20 유지호) =====
   다른 판(rev)에서 만든 ZIP을 불러올 때의 원칙 — 설계 메모 DESIGN.md 「ZIP 불러오기와 판 차이」
   ① 값·사진·메모의 열쇠는 화면 아이디(S001…)다. 아이디는 다시 쓰지 않으므로(SCREEN_IDS) 판이 달라도 같은 화면에 붙는다.
   ② 지금 흐름에서 빠진 화면(보류·폐기)의 값은 지우지 않고 「보기」 맨 아래 「지금 흐름에 없는 화면」과 측정기록.csv 「보류」 줄로 남긴다.
   ③ 그 측정 뒤에 새로 생긴 화면은 빈칸이 아니라 「측정 뒤에 생긴 화면」으로 표시한다 (SCREEN_IDS의 만든 날 기준).
   ④ 마인드맵 번호를 쓰던 옛 기록(rev 61 전)은 기존 아이디 변환(migrateIds)을 그대로 탄다.
   ⑤ 이 웹보다 새 형식(format 숫자가 큼)이면 불러오되 경고한다. 원래 ZIP은 고치지 않는다 — 고친 것은 ZIP을 새로 만든다. */
async function importZip(file){
  if(!window.JSZip){status("ZIP 도구를 불러오지 못했습니다. 인터넷 연결 후 다시 여세요.",true);return}
  status("ZIP 읽는 중… ("+file.name+")");
  let zip;try{zip=await JSZip.loadAsync(file)}catch(e){status("ZIP을 열 수 없습니다 ("+(e.message||e)+").",true);return}
  const rj=Object.keys(zip.files).filter(n=>/(^|\/)record\.json$/.test(n)&&!zip.files[n].dir);
  if(!rj.length){status("이 ZIP 안에 record.json이 없습니다 — 측정 웹에서 만든 ZIP인지 확인하세요.",true);return}
  const base=rj[0].replace(/record\.json$/,"");
  let rec;try{rec=JSON.parse((await zip.file(rj[0]).async("string")).replace(/^﻿/,""))}catch(e){status("record.json을 읽을 수 없습니다 ("+e.message+").",true);return}
  const fm=String(rec&&rec.format||"").match(/^neotech-suspension-measure\/(\d+)$/);
  if(!fm){status("측정 웹 기록 형식이 아닙니다 (format: "+(rec&&rec.format)+").",true);return}
  const warn=[];if(+fm[1]>1)warn.push("이 웹보다 새 형식("+rec.format+")이라 일부 값이 안 보일 수 있습니다");
  const curRev=CHANGELOG[CHANGELOG.length-1][0];
  // 같은 날 같은 이름이 이미 있으면 「_불러옴」 「_불러옴2」…
  let title=String(rec.title||file.name.replace(/\.zip$/i,""));
  {const day=localDay(rec.createdAt),taken=new Set((await getAll("runs")).filter(r=>localDay(r.createdAt)===day).map(r=>r.title));
   if(taken.has(title)){let t2=title+"_불러옴",k=2;while(taken.has(t2))t2=title+"_불러옴"+(k++);warn.push("이 휴대폰에 같은 날 「"+title+"」이 있어 「"+t2+"」로 넣었습니다");title=t2}}
  const r={id:uid(),title,scope:rec.scope||"all",createdAt:rec.createdAt||new Date().toISOString(),pos:0,
    shape:rec.shape||{F:{},R:{}},values:rec.values||{},photos:{},skipped:rec.skipped||{},notes:rec.notes||{},log:(rec.log||[]).slice()};
  if((rec.rev||0)>=61)r.idv=2; // 61 전 기록은 아래 migrateIds가 새 아이디로 바꾼다
  let ok=0,missing=0;const at=rec.updatedAt||r.createdAt;
  for(const [taskId,paths] of Object.entries(rec.photos||{})){
    let n=0;for(const p of paths||[]){const f=zip.file(base+p);if(!f){missing++;continue}n++;
      const raw=/^로우데이터\//.test(p)||/_raw$/.test(taskId);
      const buf=await f.async("arraybuffer");const blob=new Blob([buf],{type:raw?"application/octet-stream":"image/jpeg"});
      const id=uid();const ph={id,runId:r.id,taskId,n,blob,at};
      if(raw){const nm=p.split("/").pop();const m=nm.match(/_raw_\d+_(.+)$/);ph.fname=m?m[1]:nm}
      await put("photos",ph);(r.photos[taskId]=r.photos[taskId]||[]).push(id);ok++;
      if(ok%20===0)status("사진 넣는 중… "+ok+"장")}}
  r.imported={file:file.name,rev:rec.rev,at:nowStr(),missing};
  r.log.push({at:nowStr(),task:"",what:"ZIP 불러오기",from:file.name+" (rev "+(rec.rev??"?")+")",to:"rev "+curRev+" · 사진 "+ok+"장"});
  // 불러온 그대로는 「ZIP 만듦」 상태로 둔다 — 고치면 「ZIP 만든 뒤 고침 n건」이 붙는다
  r.exportedAt=new Date().toISOString();r.exportedLog=r.log.length;r.updatedAt=new Date().toISOString();r.posId=TASKS[0].id;
  await put("runs",r);await migrateIds();
  if(rec.rev!=null&&rec.rev!==curRev)warn.push("rev "+rec.rev+"에서 만든 기록입니다 (지금 rev "+curRev+") — 화면 아이디 기준으로 맞췄고, 지금 흐름에 없는 화면 값은 「보기」 맨 아래에 따로 보입니다");
  if(missing)warn.push("record.json에는 있는데 ZIP에 없는 사진 "+missing+"장");
  await showList();status("불러옴: 「"+title+"」 사진 "+ok+"장"+(warn.length?" · "+warn.join(" · "):""),!!(missing||+fm[1]>1));
}
